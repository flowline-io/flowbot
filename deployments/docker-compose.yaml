# Flowbot self-hosted stack (PostgreSQL + Redis + Flowbot).
# Copy docs/reference/config.yaml to ./flowbot.yaml, set credentials, and set
# listen: ":6060" (all interfaces) so the published port can reach the process.
# Prefer a strong password via /service/web/setup; do not ship flowbot-dev-pass.
# See docs/self-hosting.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowbot
      POSTGRES_PASSWORD: flowbot
      POSTGRES_DB: flowbot
    volumes:
      - flowbot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbot -d flowbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "flowbot", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "flowbot", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  lightpanda:
    image: ghcr.io/flowline-io/flowbot-lightpanda:latest
    build:
      context: ..
      dockerfile: deployments/lightpanda/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:9222"

  # Optional Chromium CDP backend: docker compose --profile playwright-cdp up -d
  playwright-cdp:
    profiles: ["playwright-cdp"]
    image: ghcr.io/flowline-io/flowbot-playwright-cdp:latest
    build:
      context: ..
      dockerfile: deployments/playwright-cdp/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9223:9222"

  # Optional Presidio Analyzer for LLM PII: docker compose --profile pii up -d
  # Enable in flowbot.yaml: pii.enabled: true, pii.analyzer_url: http://presidio-analyzer:3000
  # See .agents/notes/implemented/architecture/2026-09-18-llm-presidio-anonymizer.md
  presidio-analyzer:
    profiles: ["pii"]
    image: ghcr.io/flowline-io/flowbot-presidio-analyzer:latest
    build:
      context: ..
      dockerfile: deployments/presidio/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  flowbot:
    image: ghcr.io/flowline-io/flowbot:latest
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightpanda:
        condition: service_started
    ports:
      - "6060:6060"
    environment:
      REDIS_PASSWORD: flowbot
      # Optional one-time YAML migration only; prefer /service/web/setup.
      # WEB_PASSWORD: change-me-before-deploy
    volumes:
      - ./flowbot.yaml:/opt/app/flowbot.yaml:ro
      - flowbot-uploads:/opt/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6060/livez"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  flowbot-pg:
  flowbot-uploads:
