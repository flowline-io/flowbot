# Pipeline YAML schema / examples (reference only).
# Runtime loads published definitions from PostgreSQL — not this file.
# Apply with: flowbot pipeline apply --file <path>
# Or edit/publish in the Web UI under /service/web/pipelines.
# Agent skill: docs/skills/pipeline/

# Schema (EditorDefinition):
#   name:        string    Unique pipeline name
#   description: string    Human-readable description
#   enabled:     bool      false skips engine load
#   resumable:   bool      Enable checkpoint + restart recovery
#   triggers:    []        event | cron | webhook entries
#   steps:
#     - name:       string    Step name (unique within pipeline)
#       capability: string    Capability type (e.g. core, karakeep)
#       operation:  string    Operation name
#       params:     map       Template-rendered input. Supports {{event.field}}, {{step "name" "field"}}
#       retry:                Optional step-level retry
#         max_attempts: int
#         delay:        string
#         backoff:      string   fixed | linear | exponential
#         max_delay:    string
#         jitter:       bool
#         retry_on:     []string

name: rss_fetch_and_notify
description: "Fetch RSS feeds and send notification"
enabled: false
resumable: true
triggers:
  - type: event
    enabled: true
    event: rss.fetch.requested
steps:
  - name: fetch_feeds
    capability: rss
    operation: fetch
    params:
      url: "{{event.url}}"
      max_items: 10
    retry:
      max_attempts: 3
      delay: "1s"
      backoff: exponential
      max_delay: "60s"
      jitter: true
      retry_on:
        - timeout
        - rate_limited

  - name: send_notification
    capability: core
    operation: notify_send
    params:
      template_id: "rss.new_feeds"
      channels: ["slack"]
      payload:
        count: '{{step "fetch_feeds" "count"}}'

