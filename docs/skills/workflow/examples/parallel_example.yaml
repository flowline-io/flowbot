name: parallel_example
describe: "Fan-out with conn edges and max_concurrency"
enabled: true
max_concurrency: 3
resumable: true

inputs:
  - name: url
    type: string
    required: true
    description: "URL to bookmark and track"

triggers:
  - type: manual
    enabled: true

pipeline:
  - check_url
  - save_bookmark
  - create_task
  - merge

tasks:
  - id: check_url
    describe: "Anchor step before fan-out"
    action: capability:karakeep.check_url
    params:
      url: "{{input.url}}"

  - id: save_bookmark
    describe: "Create bookmark (parallel with create_task)"
    action: capability:karakeep.create
    params:
      url: "{{input.url}}"
    conn:
      - check_url

  - id: create_task
    describe: "Create kanban task (parallel with save_bookmark)"
    action: capability:kanboard.create_task
    params:
      title: "Follow up {{input.url}}"
    conn:
      - check_url

  - id: merge
    describe: "Join parallel branches"
    action: "mapper:"
    params:
      exists: '{{jsonpath (step "check_url" "result") "data.exists"}}'
      bookmark_id: '{{jsonpath (step "save_bookmark" "result") "data.id"}}'
      task: '{{step "create_task" "result"}}'
    conn:
      - save_bookmark
      - create_task
