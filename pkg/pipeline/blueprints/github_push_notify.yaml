kind: pipeline_blueprint
id: github_push_notify
title: GitHub push notification
description: Notify when GitHub reports a forge.push event.
requires:
  capabilities:
    - github
inputs:
  - name: notify_channel
    type: notify_channel
    required: true
    description: Notification channels
  - name: template_id
    type: string
    required: true
    description: Notification template ID from Notify settings
definition:
  description: Notify on GitHub forge.push
  resumable: true
  triggers:
    - type: event
      enabled: true
      event: forge.push
  steps:
    - name: notify
      capability: core
      operation: notify_send
      params:
        template_id: "{{inputs.template_id}}"
        channels: "{{inputs.notify_channel}}"
        payload:
          title: GitHub push
