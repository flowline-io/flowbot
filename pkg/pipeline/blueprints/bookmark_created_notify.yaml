kind: pipeline_blueprint
id: bookmark_created_notify
title: Bookmark created notification
description: Notify when Karakeep creates a bookmark.
requires:
  capabilities:
    - karakeep
inputs:
  - name: notify_channel
    type: notify_channel
    required: true
    description: Notification channels
  - name: template_id
    type: string
    required: true
    description: Notification template ID from Notify settings
definition:
  description: Notify on bookmark.created
  resumable: true
  triggers:
    - type: event
      enabled: true
      event: bookmark.created
  steps:
    - name: notify
      capability: core
      operation: notify_send
      params:
        template_id: "{{inputs.template_id}}"
        channels: "{{inputs.notify_channel}}"
        payload:
          title: Bookmark created
