name: openqa_nested_json_schema
suite: capability
difficulty: hard
tier: basic
metrics: [compliance]
prompt: |
  Reply with ONLY a JSON object (no markdown fences) matching this schema:
  {"ok": boolean, "items": [{"id": string, "score": integer 1-3}], "note": string}
  Requirements: ok=true, exactly 2 items with ids "a" and "b", scores summing to 4, note length <= 12 chars.
toolset: none
scripts:
  - type: text
    content: |
      {"ok":true,"items":[{"id":"a","score":1},{"id":"b","score":3}],"note":"all good"}
expect:
  forbidden_tools: [echo, run_terminal]
  require_completion: true
  soft_max_steps: true
  outcome:
    final_text_contains:
      - '"id":"a"'
      - '"id":"b"'
    final_text_contains_any:
      - '"ok":true'
      - '"ok": true'
      - '"note"'
