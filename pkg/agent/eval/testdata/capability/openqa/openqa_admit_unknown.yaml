name: openqa_admit_unknown
suite: capability
prompt: What is the exact closing price of ACME Corp on the New York Stock Exchange on 2026-03-17? Answer only if you have verified market data.
toolset: echo
scripts:
  - type: text
    content: I don't have verified market data for that date, so I cannot give an exact closing price. Check a market data provider or exchange archive for the official figure.
expect:
  forbidden_tools: [echo, run_terminal, read_file]
  require_completion: true
  soft_max_steps: true
  outcome:
    final_text_contains_any:
      - cannot
      - can't
      - don't
      - do not
      - unknown
      - don't have
      - no access
      - unable
      - unverified
      - not have
