name: openqa_multi_constraint
suite: capability
prompt: |
  In at most two short sentences, name one benefit of code review and one risk of skipping tests.
  Do not use bullet lists or tools.
toolset: none
scripts:
  - type: text
    content: Code review catches defects early and shares context across the team. Skipping tests raises the chance of silent regressions in production.
expect:
  forbidden_tools: [echo, run_terminal]
  require_completion: true
  soft_max_steps: true
  max_steps: 2
  outcome:
    final_text_contains_any:
      - review
      - test
