name: tools_distractor_readme_host
suite: capability
difficulty: medium
tier: combo
prompt: |
  What is the database host? README may be outdated — use app/settings.yaml as source of truth.
toolset: fs
fixtures:
  - path: README.md
    content: |
      Database host: db.legacy.example (do not change)
  - path: app/settings.yaml
    content: |
      database:
        host: db.primary.internal
        port: 5432
scripts:
  - type: tool_call
    id: c1
    name: read_file
    args: '{"path":"app/settings.yaml"}'
  - type: text
    content: The database host is db.primary.internal.
expect:
  required_tools: [read_file]
  forbidden_tools: [run_terminal]
  required_args:
    read_file: [path]
  max_steps: 5
  soft_max_steps: true
  require_completion: true
  outcome:
    final_text_contains:
      - db.primary.internal
