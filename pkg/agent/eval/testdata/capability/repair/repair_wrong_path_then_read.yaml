name: repair_wrong_path_then_read
suite: capability
difficulty: medium
tier: repair
prompt: Read docs/guide.md (try docs/guied.md first if unsure) and quote the title line.
toolset: read_file
workspace: true
fixtures:
  - path: docs/guide.md
    content: "# Eval Guide\nbody\n"
scripts:
  - type: tool_call
    id: c1
    name: read_file
    args: '{"path":"docs/guied.md"}'
  - type: tool_call
    id: c2
    name: read_file
    args: '{"path":"docs/guide.md"}'
  - type: text
    content: "Title line: # Eval Guide"
expect:
  required_tools: [read_file]
  required_args:
    read_file: [path]
  max_steps: 5
  soft_max_steps: true
  require_completion: true
  outcome:
    final_text_contains:
      - Eval Guide
