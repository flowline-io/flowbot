name: BuildAgent

on:
  push:
    branches:
      - '*'
    paths:
      - cmd/agent/**
      - pkg/**
      - go.mod
      - go.sum
  pull_request:
    paths:
      - cmd/agent/**
      - pkg/**
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Build Agent
        run: go tool task build:agent
