name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'cmd/composer/action/webdoc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build website docs
        run: go run ./cmd/composer webdoc

      - name: Verify internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # Canonical/og:url tags point at production Pages. Remap them to the
          # just-built tree so new pages are not 404 before this job deploys.
          # GitHub blob/tree HTML is rate-limited (503) and not covered by the
          # GitHub API client; remap source links to the checkout instead.
          args: >-
            --no-progress
            --exclude "http://localhost:6060"
            --remap "^https://flowline-io\.github\.io file://${{ github.workspace }}/docs/website"
            --remap "^https://github\.com/flowline-io/flowbot/(?:blob|tree)/master file://${{ github.workspace }}"
            "docs/website/**/*.html"
          fail: true

      - name: Verify HTML syntax
        run: npx --yes htmlhint "docs/website/*.html"

      - name: Push to flowline-io/flowline-io.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          external_repository: flowline-io/flowline-io.github.io
          personal_token: ${{ secrets.FLOWLINE_PAGES_TOKEN }}
          publish_dir: docs/website
          publish_branch: main
          force_orphan: true
