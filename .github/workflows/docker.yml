name: Docker

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout server repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/flowline-io/flowbot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Set build date
        id: date
        run: echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Login to Github Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: deployments/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ steps.date.outputs.date }}
            VCS_REF=${{ github.sha }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Resolve smoke test tag
        id: smoketag
        run: |
          ref_name="${{ github.ref_name }}"
          echo "value=${ref_name#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke test image
        run: |
          IMAGE="ghcr.io/flowline-io/flowbot:${{ steps.smoketag.outputs.value }}"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'image_size_bytes={{.Size}}'
          docker run --rm --entrypoint bash "$IMAGE" -lc \
            'test -x /opt/app/flowbot && test -x /opt/app/flowbot-cli_linux_amd64 && /opt/app/flowbot-cli_linux_amd64 version && composer --version && dcg --version && test -f /etc/dcg/config.toml && command -v wget'
