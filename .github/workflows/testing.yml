name: Testing

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'README.md'
      - '**/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'README.md'
      - '**/README.md'
  schedule:
    # UTC 02:00 (Beijing 10:00) — deep race scan on default branch
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-race-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Resolve packages for shard
        id: pkgs
        run: |
          PACKAGES=$(go list ./... | awk -v s=${{ matrix.shard }} -v n=4 'NR % n == s' | paste -sd ' ' -)
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Race testing (nightly deep scan)
        if: github.event_name == 'schedule'
        run: go tool task test:race:nightly PACKAGES="${{ steps.pkgs.outputs.packages }}"

      - name: Race testing (PR/push)
        if: github.event_name != 'schedule'
        run: go tool task test:race:ci PACKAGES="${{ steps.pkgs.outputs.packages }}"

  bdd:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-bdd
      cancel-in-progress: true
    # Pre-pull Postgres/Redis from registry mirrors, then tag to the spec defaults.
    # Rationale: .agents/notes/implemented/testing/2026-08-13-bdd-ci-image-mirrors.md
    env:
      POSTGRES_IMAGE: postgres:16-alpine
      REDIS_IMAGE: redis:7-alpine
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Pull BDD container images
        run: |
          set -euo pipefail

          pull_one() {
            local dest="$1"
            shift
            if docker image inspect "$dest" >/dev/null 2>&1; then
              echo "${dest} already present"
              return 0
            fi
            local attempt src
            for attempt in 1 2 3 4 5; do
              for src in "$@"; do
                echo "pulling ${src} -> ${dest} (attempt ${attempt})"
                if docker pull "$src"; then
                  if [ "$src" != "$dest" ]; then
                    docker tag "$src" "$dest"
                  fi
                  return 0
                fi
              done
              echo "image pull attempt ${attempt} failed for ${dest}; retrying..."
              sleep $((attempt * 15))
            done
            echo "failed to pull ${dest} after retries" >&2
            return 1
          }

          # Redis tries GCR first so two images do not consume the same ECR
          # anonymous quota back-to-back on a shared GitHub runner IP.
          pull_one "$POSTGRES_IMAGE" \
            public.ecr.aws/docker/library/postgres:16-alpine \
            mirror.gcr.io/library/postgres:16-alpine \
            postgres:16-alpine
          pull_one "$REDIS_IMAGE" \
            mirror.gcr.io/library/redis:7-alpine \
            public.ecr.aws/docker/library/redis:7-alpine \
            redis:7-alpine

      - name: BDD Acceptance Tests
        run: go tool task test:specs:ci

      - name: Upload BDD Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: specs-report
          path: specs-report.xml
